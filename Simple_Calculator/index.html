<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <input type="text" class="panel" readonly>
        <div class="operator-box">
            <button class="button" value="AC">AC</button>
            <button class="button" value="DEL">DEL</button>
            <button class="button" value="%">%</button>
            <button class="button sign" value="/"">/</button>
            <button class="button num" value="7">7</button>
            <button class="button num" value="8">8</button>
            <button class="button num" value="9">9</button>
            <button class="button sign" value="*">*</button>
            <button class="button num" value="4">4</button>
            <button class="button num" value="5">5</button>
            <button class="button num" value="6">6</button>
            <button class="button sign" value="-">-</button>
            <button class="button num" value="1">1</button>
            <button class="button num" value="2">2</button>
            <button class="button num" value="3">3</button>
            <button class="button sign" value="+">+</button>
            <button class="button num" id="zero" value="0">0</button>
            <button class="button num" value=".">.</button>
            <button class="button sign" value="=">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
